version: "3.8"

services:
  secretary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secretary-ai
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./secretary.db
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Direct mount of SQLite database and backups for easy host-level management
      - ./secretary.db:/app/secretary.db
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Zero-config Cloudflare Remote Tunnel for HTTPS on iPhone / Safari
  # To run with tunnel: docker compose --profile remote up -d
  cloudflared:
    profiles: ["remote"]
    image: cloudflare/cloudflared:latest
    container_name: secretary-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - secretary

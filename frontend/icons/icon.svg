<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12"/>

  <!-- Mic Body -->
  <g filter="url(#shadow)">
    <!-- Mic Capsule -->
    <rect x="216" y="140" width="80" height="150" rx="40" fill="#ffffff"/>
    
    <!-- Sound Waves / Arc -->
    <path d="M 176 220 A 80 80 0 0 0 336 220" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Stand -->
    <line x1="256" y1="300" x2="256" y2="360" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <line x1="206" y1="360" x2="306" y2="360" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>

    <!-- AI Sparkles -->
    <path d="M 370 130 Q 370 150 390 150 Q 370 150 370 170 Q 370 150 350 150 Q 370 150 370 130 Z" fill="#fef08a"/>
    <path d="M 140 160 Q 140 175 155 175 Q 140 175 140 190 Q 140 175 125 175 Q 140 175 140 160 Z" fill="#fef08a"/>
  </g>
</svg>
